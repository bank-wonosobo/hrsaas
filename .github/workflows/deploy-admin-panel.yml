name: Admin Panel CI/CD

on:
  push:
    branches:
      - development
      - test
      - main
    paths:
      - "apps/admin-panel/**"
      - ".github/workflows/deploy-admin-panel.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/admin-panel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "ENV=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "test" ]]; then
            echo "ENV=test" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
          fi

      - name: Create .env
        working-directory: apps/admin-panel
        run: |
          if [[ "${{ steps.env.outputs.ENV }}" == "dev" ]]; then
            echo "${{ secrets.ENV_DEV }}" > .env
          elif [[ "${{ steps.env.outputs.ENV }}" == "test" ]]; then
            echo "${{ secrets.ENV_TEST }}" > .env
          elif [[ "${{ steps.env.outputs.ENV }}" == "prod" ]]; then
            echo "${{ secrets.ENV_PROD }}" > .env
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        working-directory: apps/admin-panel
        run: |
          if [[ "${{ steps.env.outputs.ENV }}" == "dev" ]]; then
            API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
          elif [[ "${{ steps.env.outputs.ENV }}" == "test" ]]; then
            API_URL=${{ secrets.NEXT_PUBLIC_API_URL_TEST }}
          else
            API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
          fi

          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$API_URL \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
